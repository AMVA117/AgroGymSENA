<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Catálogo de Máquinas</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 40px;">
    <h1> Listado de Máquinas del Gimnasio</h1>
    <a href="/"> Volver al Menú Principal</a>
    <hr>
    <ul>
        {% for m in maquinas %}
            <li style="margin-bottom: 15px;">
                <strong>{{ m.nombre }}</strong> - {{ m.descripcion }} 
                <span style="color: gray;">(Estado: {{ m.estado }})</span>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
