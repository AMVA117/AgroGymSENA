<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Configuración inicial del juego de caracteres y la adaptabilidad responsive para dispositivos móviles -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Bloque de título dinámico: Permite que cada página hija personalice su propio título en la pestaña del navegador -->
    <title>{% block title %}AgroGym SENA{% endblock %}</title>
    
    <!-- Importación de Bootstrap CSS desde un CDN externo para estilizar componentes rápidamente -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <!-- ========================================== -->
    <!-- BARRA DE NAVEGACIÓN GLOBAL                 -->
    <!-- ========================================== -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <!-- Logo o marca principal que redirige al inicio del sistema -->
            <a class="navbar-brand fw-bold text-success" href="#">AgroGym SENA</a>
            
            <!-- Botón desplegable (hamburguesa) para pantallas pequeñas o móviles -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <!-- Contenedor de los enlaces del menú de navegación -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto"> <!-- ms-auto alinea los elementos hacia la derecha -->
                    <li class="nav-item">
                        <a class="nav-link active" href="#">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Máquinas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Rutinas</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- ========================================== -->
    <!-- CONTENEDOR PRINCIPAL DINÁMICO              -->
    <!-- ========================================== -->
    <main class="container my-4">
        <!-- Bloque 'content': Aquí es donde Django inyectará el código HTML específico de cada vista (index, registro, etc.) -->
        {% block content %}
        <!-- Este contenido por defecto se muestra si la vista hija no define el bloque -->
        {% endblock %}
    </main>

    <!-- ========================================== -->
    <!-- PIE DE PÁGINA (FOOTER)                     -->
    <!-- ========================================== -->
    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p class="mb-0">&copy; 2026 AgroGym SENA - Regional Cauca</p>
    </footer>

    <!-- Importación de Bootstrap JS (necesario para que funcionen los menús desplegables y componentes interactivos) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
